services:
  app:
    container_name: web-pos-app
    build:
      context: .
      dockerfile: Dockerfile
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=postgresql://pos_user:pos_password@db:5432/pos_db
      - NEXTAUTH_URL=http://localhost:3000
      - NEXTAUTH_SECRET=your-secret-key-change-in-production-12345
      - AUTH_TRUST_HOST=true
    depends_on:
      db:
        condition: service_healthy
    networks:
      - web-pos-network

  db:
    container_name: web-pos-db
    image: postgres:15-alpine
    restart: always
    environment:
      - POSTGRES_USER=pos_user
      - POSTGRES_PASSWORD=pos_password
      - POSTGRES_DB=pos_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - web-pos-network
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U pos_user -d pos_db" ]
      interval: 5s
      timeout: 5s
      retries: 5

networks:
  web-pos-network:
    driver: bridge

volumes:
  postgres_data:
